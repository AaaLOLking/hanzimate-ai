[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hanzimate-api"
version = "0.1.0"
description = "API and agent orchestration service for HanziMate AI"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.141,<0.142",
  "fsrs==6.3.2",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.52,<0.53"
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10,<3",
  "pymupdf>=1.26,<2",
  "pypdf>=6.4,<7",
  "pytest>=9.1,<10",
  "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["content/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
